name: CI

# Reduced while the repository is private, to save its Actions minutes: pull
# requests start nothing, and macOS is left out because its jobs did not start.
# When the repository becomes public, restore both, on the two lines marked
# PRIVATE below. Until then a run on any branch can be started by hand (Actions
# -> CI -> Run workflow), which is the way to test a branch before merging it.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # PRIVATE: uncomment.
  # pull_request:

permissions:
  contents: read

# Actions are pinned to a commit hash, because a tag can be moved to other code.
# Dependabot keeps the hashes and the version comments up to date
# (.github/dependabot.yml). No job pushes, so `persist-credentials: false` keeps
# the token out of .git/config for the steps after the checkout.

jobs:
  lint:
    # Separate from the matrix: ruff gives the same answer on every platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # --locked fails if uv.lock has fallen behind pyproject.toml.
      - name: Install
        run: uv sync --locked
      # Through poe, so CI runs exactly what `poe lint` runs locally. The tasks
      # live in pyproject.toml.
      - name: Lint
        run: uv run poe lint

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python on every platform, and the
        # versions in between on Linux only.
        # PRIVATE: add macos-latest.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run poe test

  coverage:
    # The gate is `fail_under` in pyproject.toml, so this job enforces exactly
    # the number `poe coverage` enforces locally — CI holds no threshold of its
    # own. One Python version is enough: what is measured is the reach of the
    # tests over the code, not anything the interpreter varies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Coverage
        run: uv run poe coverage
      - name: Upload HTML report
        # Also when the step above failed: a tripped gate is exactly when you
        # want the line-by-line report.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/

  slow:
    # The large-export test takes a few minutes; run it once, not per version.
    # On Linux, where its memory limit was measured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Slow tests
        run: uv run poe test-slow
