name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      # Through poe, so CI runs exactly what `poe lint` and `poe test` run
      # locally. The tasks live in pyproject.toml.
      - name: Lint
        run: poe lint
      - name: Test
        run: poe test

  slow:
    # The large-export test takes a few minutes; run it once, not per version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Slow tests
        run: poe test-slow
