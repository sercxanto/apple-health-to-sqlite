[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-health-to-sqlite"
version = "0.1.0"
description = "Convert an Apple Health export (HealthKit export version 14+) to SQLite, ready for Datasette"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Georg Lutz" }]
keywords = ["apple health", "healthkit", "sqlite", "datasette", "quantified self"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

# No runtime dependencies. The importer is standard library only, on purpose:
# it has to run on a stock python3 against a multi-gigabyte export without a
# virtualenv. See CONTRIBUTING.md for when an exception is acceptable.
dependencies = []

[project.urls]
Homepage = "https://github.com/sercxanto/apple-health-to-sqlite"
Issues = "https://github.com/sercxanto/apple-health-to-sqlite/issues"

[project.scripts]
health2sqlite = "apple_health_to_sqlite.cli:main"

# A group rather than an extra: `uv run` and `uv sync` install it by default,
# so `uv run poe check` works in a fresh clone, and it stays out of the metadata
# published with the package. uv.lock pins it; run `uv lock` after changing it.
[dependency-groups]
dev = [
    "coverage>=7",
    "datasette>=0.65,<1",
    "poethepoet>=0.24",
    "ruff>=0.6",
]

[tool.setuptools]
packages = [
    "apple_health_to_sqlite",
    "apple_health_to_sqlite.schema",
    "apple_health_to_sqlite.datasette",
    "apple_health_to_sqlite.catalog",
]

# The DTD lives inside the package so that it is importable both from a plain
# checkout and from an installed wheel (see apple_health_to_sqlite/dtd.py). The Datasette
# configuration is there for the same reason: `import` has to find it either
# way, and so must the catalogue `derive` loads.
[tool.setuptools.package-data]
"apple_health_to_sqlite.schema" = ["*.dtd", "*.md"]
"apple_health_to_sqlite.datasette" = ["*.yml", "*.json"]
"apple_health_to_sqlite.catalog" = ["*.json", "*.md"]

# Task runner: `poe` with no arguments lists these. They replace a Makefile, so
# they have to work on Windows too — no shell syntax, no `mkdir -p`, no `cp`.
# Anything that runs Python is a `script` task in tasks.py, which explains why;
# ruff is called directly. Extra arguments are passed on:
# `poe refresh-catalog -- --only categories`.
[tool.poe.tasks.test]
help = "Run the fast test suite"
script = "tasks:test"

[tool.poe.tasks.test-all]
help = "Run every test, including the slow large-export test"
script = "tasks:test"
env = { APPLE_HEALTH_TO_SQLITE_SLOW_TESTS = "1" }

# What the `slow` CI job runs: the large-export test on its own, so it can be
# reproduced locally without sitting through the rest of the suite.
[tool.poe.tasks.test-slow]
help = "Run only the slow large-export test"
script = "tasks:test_slow"
env = { APPLE_HEALTH_TO_SQLITE_SLOW_TESTS = "1" }

[tool.poe.tasks.coverage]
help = "Measure test coverage and enforce the gate (terminal + htmlcov/)"
script = "tasks:coverage"

[tool.poe.tasks.lint]
help = "Check formatting and lint rules"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
]

[tool.poe.tasks.format]
help = "Apply formatting and safe lint fixes"
sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
]

[tool.poe.tasks.check]
help = "Lint and fast tests — what CI runs, and what \"done\" means"
sequence = ["lint", "test"]

[tool.poe.tasks.refresh-catalog]
help = "Rebuild the category-value catalogue from Apple's documentation"
script = "tasks:refresh_catalog"

[tool.poe.tasks.clean]
help = "Remove build artefacts and caches"
script = "tasks:clean"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# Coverage measures the package only: `apple_health_to_sqlite/`, not the tests that
# exercise it, nor `tasks.py`/`tools/` which are development scaffolding. Branch
# coverage is on because a lot of the interesting untested paths here are
# `else` arms — a fallback that never fired in a test looks covered by line
# count alone. `poe coverage` writes both a terminal summary and htmlcov/.
[tool.coverage.run]
source = ["apple_health_to_sqlite"]
branch = true

[tool.coverage.report]
show_missing = true
# The gate, enforced by `poe coverage` and so by the `coverage` CI job that
# runs it. 82% is where the suite stood when this was added, rounded down to
# the point: a ratchet against regression rather than a target to chase, and
# worth raising once the real number has moved up and stayed there. Almost all
# of what is missing is `cli.py`, which no test drives yet. It stays in the
# measurement instead of being omitted, because a gap you can see is a gap
# someone can close.
fail_under = 82

[tool.coverage.html]
directory = "htmlcov"
