# Datasette configuration for a database built by apple-health-to-sqlite.
#
#   datasette health.db -m applehealth/datasette/metadata.yml --setting sql_time_limit_ms 10000
#
# The database file must be named health.db, since Datasette derives the
# database name from the filename and the settings below are keyed on it.
title: Apple Health
description_html: |-
  Built with <code>apple-health-to-sqlite</code>. Raw samples live in
  <code>records</code>, per-day aggregates in <code>daily_metrics</code>.

databases:
  health:
    tables:
      records:
        description: >-
          Every sample, one row each. type_short is the type without its HK
          prefix; local_date is the calendar date in the timezone the
          measurement was taken in.
        facets: [type_short, source_name, local_date]
        sort_desc: start_ts
      daily_metrics:
        description: >-
          Aggregated per metric and calendar day. Use total for sums (steps,
          calories) and mean for series (heart rate, weight).
        facets: [type_short]
      metric_summary:
        description: >-
          One row per metric, unit and source: how many samples there are and
          the period they cover. Start here to see what an export contains.
        facets: [source_name]
      workouts:
        facets: [activity_short, source_name]
        sort_desc: start_ts
      workout_points:
        description: GPS points from the GPX workout routes.
      category_samples:
        description: >-
          Records whose value is a name rather than a number — sleep stages,
          symptoms, mindful sessions. value_short is that name without its
          HKCategoryValue prefix; ordinal places it on a scale where the values
          form one. Unrecognised names keep their raw spelling.
        facets: [family, topic, type_short, value_short]
        sort_desc: start_local
      symptoms:
        description: >-
          The symptom diary, one row per entry. Sort by ordinal for severity;
          an entry can span days, so minutes is often large.
        facets: [symptom, severity, topic]
        sort_desc: start_local
      category_types:
        description: >-
          Reference data from Apple's HealthKit documentation: which value
          enumeration each category type uses, and how Apple groups the types.
        facets: [family]
      category_values:
        description: >-
          Reference data: every documented category value name, and where it
          sits on its scale if it has one.
        facets: [value_enum]
      unhandled:
        description: >-
          Elements the importer has no handler for. Should be empty; if it is
          not, Apple has extended the export format.

    queries:
      steps_per_day:
        title: Steps per day
        sql: |-
          select local_date, cast(total as integer) as steps
          from daily_metrics
          where type_short = 'StepCount'
          order by local_date desc
          limit 400

      weight_over_time:
        title: Weight over time
        sql: |-
          select local_date, round(mean, 2) as kg
          from daily_metrics
          where type_short = 'BodyMass'
          order by local_date

      resting_heart_rate_and_hrv:
        title: Resting heart rate and HRV side by side
        sql: |-
          select local_date,
                 round(max(case when type_short = 'RestingHeartRate'
                                then mean end), 1) as resting_hr,
                 round(max(case when type_short = 'HeartRateVariabilitySDNN'
                                then mean end), 1) as hrv_ms
          from daily_metrics
          where type_short in ('RestingHeartRate', 'HeartRateVariabilitySDNN')
          group by local_date
          order by local_date desc
          limit 400

      sleep_per_night:
        title: Sleep per night
        sql: |-
          select night_date, hours_asleep, hours_in_bed,
                 min_deep, min_rem, min_awake
          from nightly_sleep
          order by night_date desc
          limit 200

      symptom_diary:
        title: Symptom diary
        sql: |-
          select local_date, symptom, severity, ordinal, topic,
                 round(minutes) as minutes, source_name
          from symptoms
          order by start_local desc
          limit 400

      workouts:
        title: Workouts
        sql: |-
          select local_date, activity, minutes, distance, distance_unit,
                 speed, kcal, avg_hr, max_hr, n_points
          from workout_summary
          order by local_date desc
          limit 200

      weekly_totals:
        title: Weekly totals
        sql: |-
          select strftime('%Y-W%W', local_date) as week,
                 cast(sum(case when type_short = 'StepCount' then total end)
                      as integer) as steps,
                 cast(sum(case when type_short = 'ActiveEnergyBurned'
                               then total end) as integer) as active_kcal,
                 round(sum(case when type_short = 'DistanceWalkingRunning'
                                then total end), 1) as km
          from daily_metrics
          group by week
          order by week desc
          limit 100

      # Reads metric_summary rather than records: the same question asked
      # directly costs a full scan, which Datasette cuts off at its one-second
      # default on a large database.
      what_is_in_my_export:
        title: What metrics does my export contain?
        sql: |-
          select type_short, unit, sum(samples) as samples,
                 min(first_seen) as first_seen, max(last_seen) as last_seen,
                 group_concat(source_name) as sources
          from metric_summary
          group by type_short, unit
          order by samples desc

      # Datasette turns :day into an input field, e.g. 2026-08-10.
      heart_rate_on_a_day:
        title: Heart rate on one day
        sql: |-
          select start_local, value as bpm, source_name
          from records
          where type_short = 'HeartRate' and local_date = :day
          order by start_ts

      route_of_a_workout:
        title: Route of a workout (map)
        sql: |-
          select p.seq, p.latitude, p.longitude, p.elevation,
                 round(p.speed * 3.6, 1) as kmh, p.time
          from workout_points p
          where p.workout_id = (
            select id from workouts
            where local_date = :day
            order by start_ts limit 1)
          order by p.seq
